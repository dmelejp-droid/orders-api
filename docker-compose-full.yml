version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ecommerce-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ecommerce-network

  auth-api:
    build: ../auth-api
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/ordersdb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ecommerce-network

  inventory-api:
    build: ../inventory-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/inventorydb
      - SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS=kafka:29092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - kafka
    networks:
      - ecommerce-network

  orders-api:
    build: ../orders-api
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/ordersdb
      - SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS=kafka:29092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - kafka
    networks:
      - ecommerce-network

  analytics-api:
    build: ../analytics-api
    ports:
      - "8084:8084"
    environment:
      - SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - kafka
    networks:
      - ecommerce-network

  gateway-api:
    build: ../gateway-api
    ports:
      - "8000:8000"
    environment:
      - SPRING_CLOUD_GATEWAY_MVC_ROUTES_0_URI=http://auth-api:8082
      - SPRING_CLOUD_GATEWAY_MVC_ROUTES_1_URI=http://inventory-api:8080
      - SPRING_CLOUD_GATEWAY_MVC_ROUTES_2_URI=http://orders-api:8081
      - SPRING_CLOUD_GATEWAY_MVC_ROUTES_3_URI=http://analytics-api:8084
    depends_on:
      - auth-api
      - inventory-api
      - orders-api
      - analytics-api
    networks:
      - ecommerce-network

  frontend-app:
    build: ../frontend-app
    ports:
      - "3000:3000"
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
